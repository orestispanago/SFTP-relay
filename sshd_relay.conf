# SFTP-only account for partner uploads: password login, no shell, chrooted.
# Replace <sftp user> with the account name, then copy to /etc/ssh/sshd_config.d/
Match User <sftp user>
    PasswordAuthentication yes
    ForceCommand internal-sftp -u 0002 -d /upload
    ChrootDirectory /srv/sftp/<sftp user>
    AllowTcpForwarding no
    X11Forwarding no
